{% extends "base.html" %}
{% block auth_content %}
<div class="login-page">
    <div class="login-card">
        <div class="text-center bg-white p-4 p-md-5 rounded-4 shadow">
            <div class="mb-4">
                <div style="background:var(--ocaso-blue,#003396);color:white;width:72px;height:72px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold">O</div>
            </div>
            <h5 class="mb-1 fw-bold" style="color:var(--ocaso-blue)">Cambiar Contrasena</h5>
            <p class="text-muted mb-3">{{ username }} - Debes cambiar tu contrasena temporal</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for c,m in messages %}<div class="alert alert-{{ c }} py-2">{{ m }}</div>{% endfor %}{% endif %}
            {% endwith %}

            <form method="POST" autocomplete="off">
                <div class="mb-3 text-start">
                    <label class="form-label">Nueva contrasena</label>
                    <input type="password" name="password" class="form-control" required minlength="4" autofocus>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Confirmar contrasena</label>
                    <input type="password" name="confirm" class="form-control" required minlength="4">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2" style="background-color:var(--ocaso-blue)">
                    Cambiar contrasena
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
