{% extends "base.html" %}
{% block title %}Comparativa - Resultado{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-file-earmark-diff me-2" style="color:var(--ocaso-blue)"></i>Resultado Comparativa</h4>
    <a href="{{ url_for('utilidades.descargar_comparativa_pdf') }}" class="btn btn-danger btn-sm" style="background:var(--ocaso-blue)">
        <i class="bi bi-file-pdf me-1"></i> Descargar PDF
    </a>
</div>

<div class="mb-3">
    <small class="text-muted">Polizas analizadas: <strong>{{ nombres|join(', ') }}</strong></small>
</div>

<div class="card">
    <div class="card-body" style="white-space:pre-wrap;font-size:0.9rem;line-height:1.6">
        {{ analisis }}
    </div>
</div>

<div class="mt-3">
    <a href="{{ url_for('utilidades.index') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Nueva comparativa
    </a>
</div>

{% endblock %}
