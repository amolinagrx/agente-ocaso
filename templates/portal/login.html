<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Clientes - Ocaso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --portal-blue: #1a5276; --portal-blue-light: #2980b9; }
        body { background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; }
        .portal-login-card { max-width: 400px; margin: auto; }
        .portal-login-card .card { border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
        .portal-header { background: linear-gradient(135deg, var(--portal-blue), var(--portal-blue-light)); color: white; border-radius: 16px 16px 0 0; padding: 30px 20px; text-align: center; }
        .portal-header h3 { margin: 0; font-weight: 700; }
        .portal-header small { opacity: 0.8; }
    </style>
</head>
<body>
<div class="container portal-login-card">
    <div class="card border-0">
        <div class="portal-header">
            <h3>OCASO</h3>
            <small>Portal de Clientes</small>
        </div>
        <div class="card-body p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for c, m in messages %}
            <div class="alert alert-{{ c }} py-2">{{ m }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">DNI / NIF</label>
                    <input type="text" name="dni" class="form-control form-control-lg" required autofocus style="font-size:16px">
                </div>
                <div class="mb-3">
                    <label class="form-label">Contrasena</label>
                    <input type="password" name="password" class="form-control form-control-lg" required style="font-size:16px">
                </div>
                <button type="submit" class="btn btn-lg w-100 text-white" style="background:var(--portal-blue)">Acceder</button>
            </form>
            <p class="text-muted text-center small mt-3 mb-0">¿No tienes acceso? Solicitalo en tu oficina Ocaso.</p>
        </div>
    </div>
</div>
</body>
</html>
