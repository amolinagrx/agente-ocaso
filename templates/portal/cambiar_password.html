<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contrasena - Ocaso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --portal-blue: #1a5276; }
        body { background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; }
        .card { max-width: 400px; margin: auto; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
        .header { background: linear-gradient(135deg, var(--portal-blue), #2980b9); color: white; border-radius: 16px 16px 0 0; padding: 24px; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="card border-0">
        <div class="header">
            <h5 class="mb-0">Cambiar Contrasena</h5>
            <small>Hola {{ cliente.nombre.split()[0] }}, es tu primer acceso. Elige una nueva contrasena.</small>
        </div>
        <div class="card-body p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for c,m in messages %}<div class="alert alert-{{ c }} py-2">{{ m }}</div>{% endfor %}{% endif %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nueva contrasena</label>
                    <input type="password" name="password" class="form-control form-control-lg" required minlength="4" style="font-size:16px">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirmar contrasena</label>
                    <input type="password" name="confirm" class="form-control form-control-lg" required minlength="4" style="font-size:16px">
                </div>
                <button type="submit" class="btn btn-lg w-100 text-white" style="background:var(--portal-blue)">Cambiar contrasena</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
