{% extends "base.html" %}
{% block title %}Editar Cliente{% endblock %}
{% block content %}

<h4 class="mb-3"><i class="bi bi-pencil me-2" style="color:var(--ocaso-blue)"></i>Editar {{ cliente.nombre }}</h4>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre completo *</label>
                            <input type="text" name="nombre" class="form-control" value="{{ cliente.nombre }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">DNI/NIF</label>
                            <input type="text" name="dni" class="form-control" value="{{ cliente.dni or '' }}">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Direccion</label>
                            <input type="text" name="direccion" class="form-control" value="{{ cliente.direccion or '' }}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Codigo Postal</label>
                            <input type="text" name="codigo_postal" class="form-control" value="{{ cliente.codigo_postal or '' }}" maxlength="10">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Poblacion</label>
                            <input type="text" name="poblacion" class="form-control" value="{{ cliente.poblacion or '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Provincia</label>
                            <input type="text" name="provincia" class="form-control" value="{{ cliente.provincia or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Teléfono</label>
                            <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ cliente.email or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha de nacimiento</label>
                            <input type="date" name="fecha_nacimiento" class="form-control" value="{{ cliente.fecha_nacimiento }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notas</label>
                            <textarea name="notas" class="form-control" rows="3">{{ cliente.notas or '' }}</textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-danger mt-3" style="background:var(--ocaso-blue)">Guardar Cambios</button>
                    <a href="{{ url_for('clientes.ficha', id=cliente.id) }}" class="btn btn-outline-secondary mt-3 ms-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
