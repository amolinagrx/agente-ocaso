{% extends "base.html" %}
{% block title %}Nuevo Cliente{% endblock %}
{% block content %}

<h4 class="mb-3"><i class="bi bi-person-plus me-2" style="color:var(--ocaso-blue)"></i>Nuevo Cliente</h4>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre completo *</label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">DNI/NIF *</label>
                            <input type="text" name="dni" class="form-control">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Direccion</label>
                            <input type="text" name="direccion" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Codigo Postal</label>
                            <input type="text" name="codigo_postal" id="cpInput" list="cp-datalist" class="form-control" 
                                   maxlength="5" autocomplete="off" placeholder="Buscar CP..."
                                   onchange="autoFillFromCP()" oninput="autoFillFromCP()">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Poblacion</label>
                            <input type="text" name="poblacion" id="poblacionInput" list="poblacion-datalist" class="form-control" 
                                   autocomplete="off" placeholder="Buscar poblacion..."
                                   onchange="autoFillFromPoblacion()" oninput="autoFillFromPoblacion()">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Provincia</label>
                            <input type="text" name="provincia" id="provinciaInput" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Teléfono</label>
                            <input type="text" name="telefono" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Fecha de nacimiento</label>
                            <input type="date" name="fecha_nacimiento" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notas</label>
                            <textarea name="notas" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-danger mt-3" style="background:var(--ocaso-blue)">
                        <i class="bi bi-check-lg me-1"></i> Crear Cliente
                    </button>
                    <a href="{{ url_for('clientes.index') }}" class="btn btn-outline-secondary mt-3 ms-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>

<datalist id="cp-datalist"></datalist>
<datalist id="poblacion-datalist"></datalist>

<script src="{{ url_for('static', filename='js/codigos_postales.js') }}"></script>
<script>
(function(){
    var cpDl = document.getElementById('cp-datalist');
    var pobDl = document.getElementById('poblacion-datalist');
    var addedCPs = new Set();
    var addedPobs = new Set();
    
    CODIGOS_POSTALES.forEach(function(item) {
        if (!addedCPs.has(item.cp)) {
            addedCPs.add(item.cp);
            var opt = document.createElement('option');
            opt.value = item.cp;
            opt.textContent = item.cp + ' - ' + item.poblacion + ' (' + item.provincia + ')';
            cpDl.appendChild(opt);
        }
        if (!addedPobs.has(item.poblacion)) {
            addedPobs.add(item.poblacion);
            var opt2 = document.createElement('option');
            opt2.value = item.poblacion;
            opt2.textContent = item.poblacion + ' (' + item.provincia + ')';
            pobDl.appendChild(opt2);
        }
    });

    window.autoFillFromCP = function() {
        var cp = document.getElementById('cpInput').value.trim();
        var found = CODIGOS_POSTALES.find(function(item) { return item.cp === cp; });
        if (found) {
            document.getElementById('poblacionInput').value = found.poblacion;
            document.getElementById('provinciaInput').value = found.provincia;
        }
    };

    window.autoFillFromPoblacion = function() {
        var pob = document.getElementById('poblacionInput').value.trim();
        var found = CODIGOS_POSTALES.find(function(item) { return item.poblacion === pob; });
        if (found) {
            document.getElementById('cpInput').value = found.cp;
            document.getElementById('provinciaInput').value = found.provincia;
        }
    };
})();
</script>

{% endblock %}
